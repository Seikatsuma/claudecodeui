# Install as:
#   /etc/systemd/system/claudecodeui-shared.service.d/20-codex-drain.conf
#
# The Node process handles SIGTERM by draining active non-Claude turns before
# exit. Keep systemd from replacing that graceful wait with its 90-second
# default SIGKILL during a long Codex task.
[Service]
TimeoutStopSec=6h
