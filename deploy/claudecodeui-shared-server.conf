# CloudCLI (claudecodeui) - shared multi-tenant instance (open registration).
# Own HTTPS server block on the same hostname (sobsila.ru) as Account 1/2,
# on a distinct, non-standard port - same reasoning as
# claudecodeui-account2-server.conf: this app's frontend calls /api/, /ws,
# /shell as root-relative paths, so a second/third app on a SUBPATH of the
# same server{} as Account 1 would collide with it. A distinct port
# sidesteps that: this is a fully separate server{}, so /api/, /ws, /shell,
# / all work natively, no path rewriting needed. Reuses the same domain's
# existing Let's Encrypt certificate (cert covers the hostname, not a
# specific port), so no new DNS record or new certificate is needed.
#
# Public entry point: https://sobsila.ru:8444/
# CloudCLI shared instance listens on 127.0.0.1:3003
# (see deploy/claudecodeui-shared.service in the repo).
#
# To install: copy this file to /etc/nginx/conf.d/claudecodeui-shared-server.conf,
# then `nginx -t && systemctl reload nginx` (same pattern as
# claudecodeui-account2-server.conf, which is live at
# /etc/nginx/conf.d/claudecodeui-account2-server.conf today).

server {
    listen 8444 ssl;
    server_name sobsila.ru;

    ssl_certificate /etc/letsencrypt/live/sobsila.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sobsila.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Compression. The app's main JS bundle is ~2.9 MB uncompressed, which was
    # the dominant cost of a cold page load over mobile. gzip is "on" globally
    # in nginx.conf, but its gzip_types defaults to text/html only and
    # gzip_proxied is unset - so nothing proxied from the Node app (that is,
    # everything this block serves) was ever compressed. Scoped to this server
    # block so the other sites on this host keep their current behavior.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript application/json text/css image/svg+xml application/manifest+json;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
