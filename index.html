<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Claude UI</title>

    <!--
      Страховка запуска: страница никогда не остаётся белой молча.

      25.09.26, в который раз: приложение с экрана «Домой» на iPhone открылось
      белым. Сервер в это время был свободен, страница не дошла даже до
      подключения, и никакого следа не осталось — ни у сервера, ни на экране.
      iPhone выгружает страницу из памяти в фоне или при нехватке памяти и
      потом поднимает её заново; если в этот момент программа не загрузилась
      или упала, остаётся пустой лист без единой кнопки.

      Этот кусок стоит в самой странице, до программы, поэтому работает, даже
      когда программа не загрузилась вовсе:
        · программа не нарисовала экран за 15 с (пока файлы качаются без ошибок — до минуты), упала при запуске или её экран
          опустел — страница сама перезапускается (не больше двух раз подряд),
          дальше показывает экран с кнопками вместо белого листа;
        · при возврате в приложение с пустым экраном — перезапуск сразу;
        · программа запущена, а на экране ни одного видимого текста 12 с
          (01.10.26: белый лист после 21 минуты в фоне) — тот же перезапуск;
        · каждый такой случай и каждый «телефон выгрузил страницу, не
          попрощавшись» уходит в журнал службы строкой [boot-probe].
    -->
    <script>
      (function () {
        var ATTEMPTS_KEY = 'boot-guard-attempts';
        var BEAT_KEY = 'boot-guard-beat';
        // 15 с — первая проверка; пока файлы программы ещё качаются без ошибок
        // (медленная мобильная сеть, холодный запуск после выкатки ~10 с), ждём
        // дальше, до минуты. Перезапуск — только при ошибке или когда всё
        // скачалось, а экрана нет.
        var START_TIMEOUT_MS = 15000;
        var LOADING_GRACE_MS = 60000;
        var MAX_AUTO_RELOADS = 2;
        var guard = (window.__bootGuard = { started: Date.now(), errors: [], mountedOnce: false, done: false });

        function store(key, value) {
          try { if (value === null) sessionStorage.removeItem(key); else sessionStorage.setItem(key, value); } catch (e) {}
        }
        function load(key) {
          try { return sessionStorage.getItem(key); } catch (e) { return null; }
        }
        // Пульс — в localStorage: iPhone, выгружая приложение с экрана «Домой»,
        // стирает sessionStorage вместе с ним, и «страницу убили» не ловилось
        // ни разу (25.09–01.10.26: ноль записей при ежедневных выгрузках).
        function storeLocal(key, value) {
          try { localStorage.setItem(key, value); } catch (e) {}
        }
        function loadLocal(key) {
          try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        // Без хранилища (Safari с запретом данных сайтов) счётчик перезапусков
        // не переживёт перезагрузку — автоперезапуск там был бы вечным циклом.
        var storageWorks = (function () {
          try { sessionStorage.setItem('boot-guard-probe', '1'); return sessionStorage.getItem('boot-guard-probe') === '1'; }
          catch (e) { return false; }
        })();

        // Фон до программы — под тему, чтобы запуск не вспыхивал белым.
        try {
          var theme = localStorage.getItem('theme');
          var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.style.background = dark ? '#141414' : '#f7f5f1';
          // Заставке «Открываю…» — те же цвета: тело страницы до запуска
          // программы красится стилями в светлый, поверх него нужен свой фон.
          document.documentElement.style.setProperty('--boot-bg', dark ? '#141414' : '#f7f5f1');
          document.documentElement.style.setProperty('--boot-fg', dark ? '#ececec' : '#1f1f1f');
          document.documentElement.style.setProperty('--boot-dim', dark ? '#a1a1aa' : '#6b6b6b');
        } catch (e) {}

        function report(kind, extra) {
          try {
            var token = localStorage.getItem('auth-token');
            if (!token || !window.fetch) return;
            var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
            var body = {
              kind: kind,
              sinceStartMs: Date.now() - guard.started,
              nav: nav.type || '',
              standalone: !!navigator.standalone,
              visible: document.visibilityState,
              online: navigator.onLine,
              path: location.pathname.slice(0, 60),
              mountedOnce: guard.mountedOnce,
              errors: guard.errors.slice(-6),
              ua: navigator.userAgent.slice(0, 160),
            };
            if (guard.blankScreen) body.screen = JSON.stringify(guard.blankScreen);
            for (var key in extra || {}) body[key] = extra[key];
            // keepalive доносит запрос и при уходе со страницы, а ключ идёт
            // заголовком — в адресе он попал бы в журнал веб-сервера.
            fetch('/api/user/boot-probe', {
              method: 'POST',
              keepalive: true,
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
              body: JSON.stringify(body),
            }).catch(function () {});
          } catch (e) {}
        }
        guard.report = report;

        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target !== window && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var file = (target.src || target.href || '').replace(location.origin, '');
            guard.errors.push('не загрузился файл ' + file);
            // Ждать дальше бессмысленно, только если не пришёл файл самой
            // программы; упавшая картинка или чужой скрипт — не повод.
            if (file.indexOf('/assets/') === 0) guard.fatalLoad = true;
          } else {
            guard.errors.push(String(event.message || event.error || 'ошибка').slice(0, 240));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          guard.errors.push('promise: ' + String((reason && reason.message) || reason).slice(0, 240));
        });

        function rootFilled() {
          var root = document.getElementById('root');
          return !!(root && root.firstElementChild);
        }

        function attempts() {
          var raw = load(ATTEMPTS_KEY);
          if (!raw) return 0;
          var parts = raw.split(':');
          // Давняя серия не считается: лимит защищает от цикла, а не от сбоя раз в день.
          return Date.now() - Number(parts[1]) < 120000 ? Number(parts[0]) || 0 : 0;
        }

        function showRescue(reason) {
          if (document.getElementById('boot-rescue')) return;
          var dark = document.documentElement.style.background !== 'rgb(247, 245, 241)';
          var fg = dark ? '#e7e7ea' : '#1c1c1e';
          var muted = dark ? '#a1a1aa' : '#5b5b60';
          var box = document.createElement('div');
          box.id = 'boot-rescue';
          box.setAttribute('style',
            'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;' +
            'justify-content:center;gap:14px;padding:24px;text-align:center;box-sizing:border-box;' +
            'background:' + (dark ? '#141414' : '#f7f5f1') + ';color:' + fg + ';' +
            'font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif');
          var button = 'padding:12px 20px;border:0;border-radius:12px;font-size:16px;width:100%;max-width:300px;';
          box.innerHTML =
            '<b style="font-size:18px;font-weight:600">Приложение не запустилось</b>' +
            '<p style="margin:0;max-width:22rem;color:' + muted + '">Два перезапуска подряд не помогли. ' +
            'Нажмите «Открыть заново». Если снова так — «Сбросить и открыть»: телефон забудет ' +
            'сохранённую копию сайта и скачает свежую, вход и чаты останутся.</p>' +
            '<button id="boot-rescue-reload" style="' + button + 'background:#3b82f6;color:#fff">Открыть заново</button>' +
            '<button id="boot-rescue-reset" style="' + button + 'background:transparent;color:' + fg +
            ';border:1px solid ' + muted + '">Сбросить и открыть</button>' +
            '<small style="color:' + muted + ';max-width:22rem;word-break:break-word">' +
            String(reason).replace(/[<>&]/g, '') + '</small>';
          document.body.appendChild(box);
          document.getElementById('boot-rescue-reload').onclick = function () {
            store(ATTEMPTS_KEY, null);
            location.reload();
          };
          document.getElementById('boot-rescue-reset').onclick = function () {
            store(ATTEMPTS_KEY, null);
            report('rescue-reset', {});
            var jobs = [];
            try {
              if (navigator.serviceWorker) {
                jobs.push(navigator.serviceWorker.getRegistrations().then(function (list) {
                  return Promise.all(list.map(function (r) { return r.unregister(); }));
                }));
              }
              if (window.caches) {
                jobs.push(caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }));
              }
            } catch (e) {}
            Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
            setTimeout(function () { location.reload(); }, 3000);
          };
        }

        // Одна точка решения: перезапустить самим или показать экран с кнопками.
        function recover(reason) {
          if (guard.done) return;
          guard.done = true;
          var n = attempts();
          if (storageWorks && n < MAX_AUTO_RELOADS) {
            store(ATTEMPTS_KEY, (n + 1) + ':' + Date.now());
            report('auto-reload', { reason: reason, attempt: n + 1 });
            setTimeout(function () { location.reload(); }, 300);
          } else {
            report('rescue-screen', { reason: reason, attempt: n });
            showRescue(reason);
          }
        }
        guard.recover = recover;

        function check(why, screenBlank) {
          if (guard.done) return;
          if (!screenBlank && rootFilled()) return;
          var last = guard.errors[guard.errors.length - 1];
          recover(why + (last ? ' · ' + last : ''));
        }

        // Программа не нарисовала экран — ждём, пока страница видна: в фоне iOS
        // замораживает всё, и секунды там ничего не значат.
        // Докачка ещё идёт — или только что закончилась: программе нужно
        // мгновение, чтобы нарисовать первый экран после загрузки файлов.
        window.addEventListener('load', function () { guard.loadedAt = Date.now(); });
        function stillLoading() {
          if (guard.fatalLoad || Date.now() - guard.started >= LOADING_GRACE_MS) return false;
          return document.readyState !== 'complete' || !guard.loadedAt || Date.now() - guard.loadedAt < 5000;
        }
        function armStartTimer(delay) {
          setTimeout(function () {
            if (guard.mountedOnce || guard.done) return;
            if (document.visibilityState === 'hidden') return;
            if (stillLoading()) { armStartTimer(3000); return; }
            check('экран не появился за ' + Math.round((Date.now() - guard.started) / 1000) + ' с');
          }, delay);
        }
        armStartTimer(START_TIMEOUT_MS);

        document.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          if (!root || !window.MutationObserver) return;
          var emptyTimer = null;
          new MutationObserver(function () {
            if (root.firstElementChild) {
              if (!guard.mountedOnce) {
                guard.mountedOnce = true;
                // Удачный запуск, проживший 20 с, обнуляет серию перезапусков.
                setTimeout(function () { if (rootFilled()) store(ATTEMPTS_KEY, null); }, 20000);
              }
              if (emptyTimer) { clearTimeout(emptyTimer); emptyTimer = null; }
            } else if (guard.mountedOnce && !emptyTimer) {
              // Экран был и опустел — так выглядит падение программы без перехвата.
              emptyTimer = setTimeout(function () { check('экран программы опустел'); }, 1500);
            }
          }).observe(root, { childList: true });
        });

        // Возврат в приложение: белый лист — перезапуск сразу, без ожидания.
        function onReturn() {
          if (document.visibilityState !== 'visible') return;
          if (!guard.mountedOnce && Date.now() - guard.started > START_TIMEOUT_MS && !stillLoading()) {
            check('возврат в приложение, экрана нет');
          } else if (guard.mountedOnce && !rootFilled()) {
            check('возврат в приложение, экран пуст');
          }
        }
        document.addEventListener('visibilitychange', onReturn);
        // pageshow приходит и в конце обычной загрузки — возвратом считается
        // только восстановление страницы из памяти браузера (persisted).
        window.addEventListener('pageshow', function (event) { if (event.persisted) onReturn(); });

        // Белый экран у запущенной программы (01.10.26). Приложение вернулось
        // из фона через 21 минуту, связь поднялась, программа числилась
        // нарисованной — а на экране было пусто, и страховка молчала: #root не
        // пуст. Теперь, пока страница видна, раз в 4 с ищем на экране хоть
        // один видимый текст, не закрытый ничем сверху. Пусто три проверки
        // подряд — в журнал службы, что именно сверху, и перезапуск (тот же
        // предел: два раза, дальше кнопки). Картинка или окно во весь экран —
        // не пустота.
        function screenHasContent() {
          var w = window.innerWidth, h = window.innerHeight;
          if (!document.body || !w || !h) return true;
          var top = document.elementFromPoint(w / 2, h / 2);
          if (top && /^(IMG|VIDEO|CANVAS|IFRAME|svg)$/.test(top.tagName)) return true;
          if (document.querySelector('[role="dialog"], dialog[open]')) return true;
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          var range = document.createRange();
          for (var seen = 0, node = walker.nextNode(); node && seen < 600; node = walker.nextNode()) {
            if (!node.nodeValue || !node.nodeValue.trim()) continue;
            var parent = node.parentElement;
            if (!parent || /^(SCRIPT|STYLE|NOSCRIPT|TEMPLATE)$/.test(parent.tagName)) continue;
            seen++;
            range.selectNodeContents(node);
            var r = range.getBoundingClientRect();
            if (r.width < 1 || r.height < 1 || r.bottom <= 0 || r.right <= 0 || r.top >= h || r.left >= w) continue;
            var x = Math.min(Math.max(r.left + Math.min(r.width, 8) / 2, 0), w - 1);
            var y = Math.min(Math.max(r.top + r.height / 2, 0), h - 1);
            // Скрытый или прозрачный текст тоже имеет размеры — не считается.
            if (parent.checkVisibility && !parent.checkVisibility({ opacityProperty: true, visibilityProperty: true })) continue;
            if (getComputedStyle(parent).visibility !== 'visible') continue;
            var hit = document.elementFromPoint(x, y);
            if (!hit) continue;
            if (hit === parent || parent.contains(hit)) return true;
            // Подпись без отклика на касание (pointer-events: none) «пропускает»
            // попадание к своему контейнеру — засчитываем, но не страницу целиком.
            if (hit.contains(parent) && hit !== document.body && hit !== document.documentElement && hit.id !== 'root') return true;
          }
          return false;
        }
        function describeScreen() {
          var top = document.elementFromPoint(window.innerWidth / 2, window.innerHeight / 2);
          var root = document.getElementById('root');
          return {
            topAtCenter: top ? (top.tagName + (top.id ? '#' + top.id : '') + '.' + String(top.className && top.className.baseVal !== undefined ? top.className.baseVal : top.className || '').slice(0, 80)) : '',
            rootText: root ? (root.innerText || '').trim().length : -1,
            rootHeight: root ? Math.round(root.getBoundingClientRect().height) : -1,
            viewport: window.innerWidth + 'x' + window.innerHeight,
            hiddenForSec: guard.hiddenAt ? Math.round((guard.shownAt - guard.hiddenAt) / 1000) : 0,
          };
        }
        var blankChecks = 0;
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') guard.hiddenAt = Date.now();
          else guard.shownAt = Date.now();
          blankChecks = 0;
        });
        setInterval(function () {
          if (guard.done || !guard.mountedOnce || document.visibilityState !== 'visible') return;
          var blank = false;
          try { blank = !screenHasContent(); } catch (e) { return; }
          blankChecks = blank ? blankChecks + 1 : 0;
          if (blankChecks === 3) {
            guard.blankScreen = describeScreen();
            check('на экране пусто', true);
          }
        }, 4000);

        // Выгрузил ли телефон прошлую страницу, не попрощавшись. Пульс пишется
        // раз в 5 с, прощание — в pagehide. Пульс без прощания = страницу убили.
        var beat = loadLocal(BEAT_KEY);
        // localStorage общий для вкладок: на компьютере пульс без прощания может
        // принадлежать соседней живой вкладке (фоновая пульсирует раз в минуту).
        // Приложение с экрана «Домой» — всегда одна страница.
        var beatSilentMs = beat ? Date.now() - Number(beat.split(':')[0]) : 0;
        if (beat && beat.indexOf('bye') === -1 && (navigator.standalone || beatSilentMs > 90000)) {
          var lastBeat = Number(beat.split(':')[0]);
          guard.previousKilled = true;
          setTimeout(function () {
            report('page-was-killed', { silentForSec: Math.round((Date.now() - lastBeat) / 1000), lastState: beat.split(':')[1] || '' });
          }, 4000);
        }
        // После прощания пульс молчит: браузер шлёт «страница скрыта» уже после
        // pagehide, и без этого обычная перезагрузка выглядела бы как убийство.
        var leaving = false;
        function pulse() { if (!leaving) storeLocal(BEAT_KEY, Date.now() + ':' + document.visibilityState); }
        pulse();
        setInterval(pulse, 5000);
        document.addEventListener('visibilitychange', pulse);
        window.addEventListener('pagehide', function () { leaving = true; storeLocal(BEAT_KEY, Date.now() + ':bye'); });
        window.addEventListener('pageshow', function () { leaving = false; pulse(); });
      })();
    </script>

    <!-- Fonts: Encode Sans (UI) + Merriweather (chat), self-hosted.
         These used to come straight from fonts.googleapis.com as a
         render-blocking stylesheet, so on any network where Google Fonts is
         slow or unreachable (various VPNs, several countries this instance is
         used from) the browser painted nothing until that request timed out.
         Served from this origin now, so the page never depends on a third
         party to render. Regenerate with the Google Fonts CSS if the family
         list changes; see public/fonts/fonts.css. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Обязательная пара к строке ниже. Apple учитывает
      apple-mobile-web-app-status-bar-style ТОЛЬКО когда рядом стоит
      apple-mobile-web-app-capable. Без неё iOS не считает страницу
      веб-приложением в своём, «яблочном» смысле: строка состояния
      остаётся непрозрачной, и высота содержимого урезается на её 62
      точки, хотя само окно занимает экран целиком.

      Замер с телефона Егора: экран 874, окно 874, а содержимое 812,
      начиная с самого верха. Те самые 62 точки и оставались пустой
      полосой внизу — вне страницы, поэтому никакая правка стилей до
      неё не дотягивалась. Заодно 62 точки отступа сверху, которые
      приложение честно добавляло под строку состояния, оказывались
      лишними: iOS уже вычла их.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Claude UI" />
    
    <!-- iOS Safari Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    
    <!-- Theme Color -->
    <!-- Под тёмную иконку: белая полоса вокруг приложения выбивалась из неё. -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    
    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Заставка до первого экрана приложения (26.09.26). Раньше до запуска
         программы экран был пустым, а на iPhone в тёмной теме — чисто чёрным,
         и Егор не понимал, идёт ли что-то вообще («пусть хоть экран с инфо,
         что идёт загрузка»). Чистый HTML/CSS, без скриптов: видна, даже если
         программа не скачалась. Прячется сама, как только в #root появился
         экран (#root:not(:empty)). Вторая строка — через 4 с, чтобы быстрый
         запуск не мигал лишним текстом. Страховка запуска (boot-rescue) не
         затронута: она смотрит только в #root. -->
    <div id="boot-splash" aria-live="polite">
      <b>Открываю Claude UI…</b>
      <p>Загружаю приложение. Если идёт обновление или связь слабая, это займёт до минуты.</p>
    </div>
    <style>
      #boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:10px;padding:24px;text-align:center;box-sizing:border-box;pointer-events:none;
        font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        background:var(--boot-bg,#f7f5f1);color:var(--boot-fg,#1f1f1f)}
      #boot-splash b{font-size:18px;font-weight:600}
      #boot-splash p{margin:0;max-width:20rem;color:var(--boot-dim,#6b6b6b);opacity:0;animation:boot-splash-hint .3s 4s forwards}
      @keyframes boot-splash-hint{to{opacity:1}}
      #root:not(:empty) ~ #boot-splash{display:none}
    </style>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
