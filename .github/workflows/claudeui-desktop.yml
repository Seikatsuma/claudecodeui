name: Claude UI для компьютера

# Mac (macOS 13+) — отдельный файл под процессор M и под Intel: каждый вдвое
# легче общего. Windows 10 и 11 — один установщик. Затем проверка ИЗ УСТАНОВЩИКОВ на разных версиях систем:
# программа ставится как у человека, входит пробным аккаунтом, открывает
# «Этот компьютер» и снимает экран. Запуск: пуш в desktop-app или вручную.
on:
  workflow_dispatch:
  push:
    branches:
      - desktop-app

permissions:
  contents: read

jobs:
  build:
    name: Сборка — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac на M
            os: macos-latest
            target: --mac
            chip: M
            artifact: claude-ui-mac-M
          - name: Mac на Intel
            os: macos-15-intel
            target: --mac
            chip: Intel
            artifact: claude-ui-mac-Intel
          - name: Windows 10/11
            os: windows-latest
            target: --win
            artifact: claude-ui-windows
    steps:
      - name: Код
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Пакеты
        run: npm ci
        env:
          HUSKY: '0'
          # ripgrep и др. качают файлы с GitHub: без ключа — отказ 403 по лимиту
          GITHUB_TOKEN: ${{ github.token }}

      - name: Сборка интерфейса и сервера
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Сборка программы
        run: node scripts/release/build-claudeui-desktop.mjs ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDEUI_BUILD: ${{ github.run_number }}

      - name: Mac — подпись «для себя» и .dmg
        if: runner.os == 'macOS'
        run: |
          APP="$(find release/claudeui -maxdepth 2 -name 'Claude UI.app' -type d | head -1)"
          test -n "$APP"
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/release/make-mac-dmg.mjs "$APP" out "$VERSION" ${{ matrix.chip }}
          ls -la out/*.dmg

      - name: Выгрузка .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: out/*.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Выгрузка установщика Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: release/claudeui/*.exe
          if-no-files-found: error
          compression-level: 0

  update-pack:
    name: Начинка для обновления без установщика
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Код
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          # «Что нового» — тема последней настоящей правки: после слияния сайта она глубже одного коммита.
          fetch-depth: 50
      - name: Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Пакеты
        run: npm ci
        env:
          HUSKY: '0'
          GITHUB_TOKEN: ${{ github.token }}
      - name: Сборка интерфейса и сервера
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Начинка этой сборки
        run: |
          CLAUDEUI_STAGE_ONLY=1 node scripts/release/build-claudeui-desktop.mjs --linux
          node scripts/release/pack-claudeui-update.mjs out/update
        env:
          CLAUDEUI_BUILD: ${{ github.run_number }}
      # Та же начинка с номером больше — проба ставит её поверх только что
      # установленной программы и проверяет, что интерфейс поднялся.
      - name: Пробная начинка для проверки обновления
        run: |
          export CLAUDEUI_BUILD=$(( ${{ github.run_number }} + 1000000 ))
          CLAUDEUI_STAGE_ONLY=1 node scripts/release/build-claudeui-desktop.mjs --linux
          node scripts/release/pack-claudeui-update.mjs out/update-test
      - name: Выгрузка начинки
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: claudeui-update
          path: out/update/
          if-no-files-found: error
      - name: Выгрузка пробной начинки
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: claudeui-update-test
          path: out/update-test/
          if-no-files-found: error

  smoke:
    name: Проверка — ${{ matrix.name }}
    needs: [build, update-pack]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS 14 (M), os: macos-14, kind: mac, artifact: claude-ui-mac-M, optional: false }
          - { name: macOS 15 (M), os: macos-15, kind: mac, artifact: claude-ui-mac-M, optional: false }
          - { name: macOS 26 (M), os: macos-26, kind: mac, artifact: claude-ui-mac-M, optional: true }
          - { name: macOS 15 (Intel), os: macos-15-intel, kind: mac, artifact: claude-ui-mac-Intel, optional: false }
          - { name: Windows 10 (ядро Server 2022), os: windows-2022, kind: win, artifact: claude-ui-windows, optional: false }
          - { name: Windows 11 (ядро Server 2025), os: windows-2025, kind: win, artifact: claude-ui-windows, optional: false }
          - { name: Windows 11 ARM, os: windows-11-arm, kind: win, artifact: claude-ui-windows, optional: true }
    steps:
      - name: Код
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Установщик
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer
      - name: Пробная начинка
        uses: actions/download-artifact@v4
        with:
          name: claudeui-update-test
          path: update-test
      - name: Установка на Mac — как человек, из .dmg в «Программы»
        if: matrix.kind == 'mac'
        run: |
          sw_vers
          DMG="$(ls installer/*.dmg | head -1)"
          # Окно установки, как его увидит человек: открыть образ и снять экран.
          mkdir -p smoke
          hdiutil attach "$DMG"
          open "/Volumes/Claude UI"
          sleep 6
          screencapture -x smoke/00-окно-установки.png || true
          ls -la "/Volumes/Claude UI"
          hdiutil detach "/Volumes/Claude UI" -force
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/ClaudeUI
          ls -la /Volumes/ClaudeUI
          cp -R "/Volumes/ClaudeUI/Claude UI.app" /Applications/
          hdiutil detach /Volumes/ClaudeUI
          echo "SMOKE_APP=/Applications/Claude UI.app/Contents/MacOS/Claude UI" >> "$GITHUB_ENV"
      - name: Mac — вход Claude из Связки ключей виден при отправке сообщения
        # 28.09: программа называла Claude папку ~/.claude явно, и Claude искал вход
        # в записи «Claude Code-credentials-<8 знаков>» вместо «Claude Code-credentials»
        # — вход через браузер не находился («Not logged in»). Здесь — сама причина на
        # настоящей macOS: пробный вход в Связке, вопрос встроенному Claude с папкой и без.
        if: matrix.kind == 'mac'
        continue-on-error: true
        run: |
          CLI="$(find "/Applications/Claude UI.app" -path '*claude-agent-sdk-darwin*' -name claude -type f | head -1)"
          echo "встроенный Claude: $CLI"
          EXP=$(( ($(date +%s) + 86400) * 1000 ))
          security add-generic-password -U -a "$USER" -s "Claude Code-credentials" \
            -w "{\"claudeAiOauth\":{\"accessToken\":\"sk-ant-oat01-probe\",\"refreshToken\":\"sk-ant-ort01-probe\",\"expiresAt\":$EXP,\"scopes\":[\"user:inference\",\"user:profile\"],\"subscriptionType\":\"max\"}}"
          # Только строка входа: с явной папкой Claude ещё и ругается на .claude.json — длинный текст.
          NO_DIR=$(env -u CLAUDE_CONFIG_DIR "$CLI" auth status --json 2>/dev/null | grep -o '"loggedIn": *[a-z]*')
          WITH_DIR=$(CLAUDE_CONFIG_DIR="$HOME/.claude" "$CLI" auth status --json 2>/dev/null | grep -o '"loggedIn": *[a-z]*')
          echo "без папки:        $NO_DIR"
          echo "с папкой ~/.claude: $WITH_DIR"
          security delete-generic-password -a "$USER" -s "Claude Code-credentials" >/dev/null || true
          echo "$NO_DIR" | grep -q '"loggedIn": *true' || { echo "без папки вход не виден"; exit 1; }
          echo "$WITH_DIR" | grep -q '"loggedIn": *false' || { echo "с явной папкой вход виден — причина на этой macOS не подтвердилась"; exit 1; }
          echo "причина подтверждена: с явной папкой вход из Связки не виден"
      - name: Установка на Windows — установщиком, без вопросов
        if: matrix.kind == 'win'
        shell: pwsh
        run: |
          [System.Environment]::OSVersion | Format-List
          $exe = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Claude UI.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'программа не установилась' }
          "SMOKE_APP=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Запуск, вход, «Этот компьютер», снимок
        timeout-minutes: 10
        shell: bash
        run: node scripts/release/smoke-claudeui-desktop.mjs
        env:
          SMOKE_OUT: smoke
          SMOKE_UPDATE_DIR: update-test
          SMOKE_EMAIL: ${{ secrets.CLAUDEUI_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.CLAUDEUI_SMOKE_PASSWORD }}
      - name: Снимки и журнал
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: smoke-${{ matrix.os }}
          path: smoke/
          if-no-files-found: warn

  update-publish:
    name: Выкладка обновления
    needs: [smoke, update-pack]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Начинка
        uses: actions/download-artifact@v4
        with:
          name: claudeui-update
          path: update
      - name: Выпуск desktop-update-${{ github.run_number }}
        run: |
          NOTES="$(node -p "require('./update/update.json').notes || ''")"
          gh release create "desktop-update-${{ github.run_number }}" update/* \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
            --title "Обновление программы, сборка ${{ github.run_number }}" \
            --notes "Начинка Claude UI для компьютера (интерфейс и сервер) — программа ставит её кнопкой «Обновить». ${NOTES}"
        env:
          GH_TOKEN: ${{ github.token }}
